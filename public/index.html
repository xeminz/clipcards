<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipCards</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #e4e2dc; --accent: #d9480f; --accent-soft: #fff0e8; --danger: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1e1e21; --text: #ececee; --muted: #9a9aa2;
      --line: #2e2e33; --accent: #ff7a3d; --accent-soft: #2c1d16; --danger: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 2px 0 0; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 40px;
         display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
          background: var(--bg); color: var(--text); font: inherit; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { padding: 10px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
           font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); font-weight: 500; }
  .status { margin-top: 10px; font-size: 14px; color: var(--muted); min-height: 1.5em; }
  .status.err { color: var(--danger); }
  .list { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .item { text-align: left; background: transparent; color: var(--text); border: 1px solid transparent;
          padding: 10px; border-radius: 8px; font-weight: 400; cursor: pointer; }
  .item:hover { background: var(--bg); }
  .item.active { background: var(--accent-soft); border-color: var(--accent); }
  .item b { display: block; font-size: 15px; line-height: 1.3; }
  .item small { color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 2px; }
  .detail h2 { margin: 0 0 4px; font-size: 22px; line-height: 1.25; }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .meta a { color: var(--accent); }
  .summary p { margin: 0 0 10px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 12px; align-items: center; }
  .tools h3 { margin: 0 auto 0 0; font-size: 18px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .card { perspective: 1000px; min-height: 170px; cursor: pointer; }
  .card-inner { position: relative; width: 100%; height: 100%; min-height: 170px;
                transition: transform .45s; transform-style: preserve-3d; }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 12px;
          border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; overflow: auto; }
  .front { background: var(--panel); }
  .back { background: var(--accent-soft); border-color: var(--accent); transform: rotateY(180deg); }
  .face .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
  .face .txt { font-size: 15px; }
  .front .txt { font-weight: 600; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .placeholder { color: var(--muted); text-align: center; padding: 60px 20px; }
</style>
</head>
<body>
<header>
  <h1>Clip<span>Cards</span></h1>
  <p class="sub">YouTube-Video rein, Zusammenfassung und Lernkarten raus.</p>
</header>
<main>
  <aside class="panel">
    <form id="add">
      <input id="url" placeholder="YouTube-Link einfügen…" autocomplete="off" required>
      <button id="addBtn">Los</button>
    </form>
    <div id="status" class="status"></div>
    <input id="search" placeholder="Videos und Karten durchsuchen…" style="width:100%;margin-top:6px">
    <div id="list" class="list"></div>
  </aside>
  <section id="detail" class="panel detail">
    <div class="placeholder">Füge links einen YouTube-Link ein oder wähle ein gespeichertes Video.</div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
let activeId = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Fehler ${r.status}`);
  return j;
}

async function loadList() {
  const q = $("#search").value.trim();
  const videos = await api("/api/videos" + (q ? "?q=" + encodeURIComponent(q) : ""));
  $("#list").innerHTML = videos.length
    ? videos.map((v) => `
        <button class="item ${v.id === activeId ? "active" : ""}" data-id="${v.id}">
          <b>${esc(v.title || v.video_id)}</b>
          <small>${esc(v.channel || "")}${v.channel ? " · " : ""}${v.card_count} Karten</small>
        </button>`).join("")
    : `<div class="empty">${q ? "Nichts gefunden." : "Noch keine Videos gespeichert."}</div>`;
}

async function showVideo(id) {
  activeId = id;
  const v = await api("/api/videos/" + id);
  const paras = v.summary.split(/\n\s*\n/).map((p) => `<p>${esc(p)}</p>`).join("");
  $("#detail").innerHTML = `
    <h2>${esc(v.title || v.video_id)}</h2>
    <div class="meta">${esc(v.channel || "")}${v.channel ? " · " : ""}<a href="${esc(v.url)}" target="_blank" rel="noopener">auf YouTube ansehen</a></div>
    <div class="summary">${paras}</div>
    <div class="tools">
      <h3>Lernkarten (${v.cards.length})</h3>
      <button class="ghost" id="shuffle">Mischen</button>
      <button class="ghost" id="reset">Alle umdrehen</button>
      <button class="danger" id="del">Löschen</button>
    </div>
    <div class="cards" id="cards"></div>
    <div class="hint">Tipp: Klick auf eine Karte dreht sie um.</div>`;
  renderCards(v.cards);
  $("#shuffle").onclick = () => renderCards([...v.cards].sort(() => Math.random() - 0.5));
  $("#reset").onclick = () => document.querySelectorAll(".card").forEach((c) => c.classList.remove("flipped"));
  $("#del").onclick = async () => {
    if (!confirm("Dieses Video samt Karten löschen?")) return;
    await api("/api/videos/" + id, { method: "DELETE" });
    activeId = null;
    $("#detail").innerHTML = `<div class="placeholder">Gelöscht.</div>`;
    loadList();
  };
  loadList();
}

function renderCards(cards) {
  $("#cards").innerHTML = cards.map((c, i) => `
    <div class="card">
      <div class="card-inner">
        <div class="face front"><div class="label">Frage ${i + 1}</div><div class="txt">${esc(c.question)}</div></div>
        <div class="face back"><div class="label">Antwort</div><div class="txt">${esc(c.answer)}</div></div>
      </div>
    </div>`).join("");
  document.querySelectorAll(".card").forEach((el) => el.onclick = () => el.classList.toggle("flipped"));
}

$("#add").onsubmit = async (e) => {
  e.preventDefault();
  const btn = $("#addBtn"), st = $("#status");
  btn.disabled = true; st.className = "status";
  st.textContent = "Hole Transkript und erstelle Karten… (kann bis zu einer Minute dauern)";
  try {
    const v = await api("/api/videos", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: $("#url").value }),
    });
    st.textContent = "Fertig!";
    $("#url").value = "";
    $("#search").value = "";
    showVideo(v.id);
  } catch (err) {
    st.className = "status err"; st.textContent = err.message;
  } finally { btn.disabled = false; }
};

$("#list").onclick = (e) => { const b = e.target.closest(".item"); if (b) showVideo(Number(b.dataset.id)); };
let t; $("#search").oninput = () => { clearTimeout(t); t = setTimeout(loadList, 200); };
loadList();
</script>
</body>
</html>
